name: Moodle Plugin CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ""
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        moodle-branch: ['MOODLE_503_STABLE']

    steps:
      - name: Check out plugin code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, intl, soap, zip, gd
          ini-values: max_input_vars=5000

      - name: Install en_AU.UTF-8 locale
        run: sudo locale-gen en_AU.UTF-8

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$GITHUB_WORKSPACE/ci/bin" >> $GITHUB_PATH
          echo "$GITHUB_WORKSPACE/ci/vendor/bin" >> $GITHUB_PATH

      - name: Install Moodle
        env:
          DB: pgsql
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

      - name: PHP Lint
        if: always()
        run: moodle-plugin-ci phplint ./plugin

      - name: Moodle Coding Style (phpcs)
        if: always()
        run: moodle-plugin-ci codechecker ./plugin

      - name: PHPDoc check
        if: always()
        run: moodle-plugin-ci phpdoc -m ./moodle ./plugin

      - name: Moodle Plugin Validation
        if: always()
        run: moodle-plugin-ci validate -m ./moodle ./plugin

      - name: Upgrade Savepoints check
        if: always()
        run: moodle-plugin-ci savepoints ./plugin

      - name: Mustache Lint
        if: always()
        run: moodle-plugin-ci mustache ./plugin

      - name: PHPUnit Tests
        if: always()
        run: moodle-plugin-ci phpunit -m ./moodle ./plugin
